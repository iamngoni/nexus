[package]
name = "nexus"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-files = "0.6.10"
actix-rt = "2.11.0"
actix-web = "4.12.1"
chrono = { version = "0.4.43", features = ["serde"] }
reqwest = { version = "0.13.1", features = ["json", "cookies"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tera = "1.20.1"
tokio = { version = "1.49.0", features = ["full"] }
