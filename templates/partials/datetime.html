<span class="text-sm text-gray-400">{{ greeting }}, <span class="text-white font-medium">{{ user_name }}</span></span>
<span class="text-sm font-mono text-nexus-muted">{{ date }} — {{ time }}</span>
<button class="relative p-2 rounded-lg hover:bg-nexus-tile transition-colors">
    <i data-lucide="bell" class="w-4 h-4 text-nexus-muted"></i>
    <span class="absolute top-1.5 right-1.5 w-1.5 h-1.5 rounded-full bg-nexus-accent"></span>
</button>
