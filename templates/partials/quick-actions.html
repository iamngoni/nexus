<!-- Header -->
<div class="flex items-center justify-between mb-4">
    <h2 class="text-sm font-semibold text-white">Quick Actions</h2>
    <i data-lucide="zap" class="w-4 h-4 text-nexus-muted"></i>
</div>

<!-- Action buttons grid -->
<div class="grid grid-cols-2 gap-2.5">
    <!-- Pause Downloads -->
    <button class="bg-nexus-tile border border-nexus-tile-border rounded-tile p-3 flex flex-col items-center gap-2 hover:border-nexus-tertiary/40 hover:bg-nexus-tertiary/5 transition-all group"
            hx-post="/api/actions/qbit/pause"
            hx-swap="innerHTML"
            hx-target="#action-feedback">
        <i data-lucide="pause" class="w-4 h-4 text-nexus-tertiary group-hover:scale-110 transition-transform"></i>
        <span class="text-[10px] text-gray-400 group-hover:text-nexus-tertiary transition-colors">Pause DLs</span>
    </button>

    <!-- Resume Downloads -->
    <button class="bg-nexus-tile border border-nexus-tile-border rounded-tile p-3 flex flex-col items-center gap-2 hover:border-nexus-accent/40 hover:bg-nexus-accent/5 transition-all group"
            hx-post="/api/actions/qbit/resume"
            hx-swap="innerHTML"
            hx-target="#action-feedback">
        <i data-lucide="play" class="w-4 h-4 text-nexus-accent group-hover:scale-110 transition-transform"></i>
        <span class="text-[10px] text-gray-400 group-hover:text-nexus-accent transition-colors">Resume DLs</span>
    </button>

    <!-- Restart qBittorrent -->
    <button class="bg-nexus-tile border border-nexus-tile-border rounded-tile p-3 flex flex-col items-center gap-2 hover:border-nexus-error/40 hover:bg-nexus-error/5 transition-all group"
            hx-post="/api/actions/restart/qbittorrent"
            hx-swap="innerHTML"
            hx-target="#action-feedback"
            hx-confirm="Restart qBittorrent container?">
        <i data-lucide="rotate-ccw" class="w-4 h-4 text-nexus-error group-hover:scale-110 transition-transform"></i>
        <span class="text-[10px] text-gray-400 group-hover:text-nexus-error transition-colors">Restart qBit</span>
    </button>

    <!-- Restart Sonarr -->
    <button class="bg-nexus-tile border border-nexus-tile-border rounded-tile p-3 flex flex-col items-center gap-2 hover:border-nexus-error/40 hover:bg-nexus-error/5 transition-all group"
            hx-post="/api/actions/restart/sonarr"
            hx-swap="innerHTML"
            hx-target="#action-feedback"
            hx-confirm="Restart Sonarr container?">
        <i data-lucide="rotate-ccw" class="w-4 h-4 text-nexus-error group-hover:scale-110 transition-transform"></i>
        <span class="text-[10px] text-gray-400 group-hover:text-nexus-error transition-colors">Restart Sonarr</span>
    </button>

    <!-- Restart Radarr -->
    <button class="bg-nexus-tile border border-nexus-tile-border rounded-tile p-3 flex flex-col items-center gap-2 hover:border-nexus-error/40 hover:bg-nexus-error/5 transition-all group"
            hx-post="/api/actions/restart/radarr"
            hx-swap="innerHTML"
            hx-target="#action-feedback"
            hx-confirm="Restart Radarr container?">
        <i data-lucide="rotate-ccw" class="w-4 h-4 text-nexus-error group-hover:scale-110 transition-transform"></i>
        <span class="text-[10px] text-gray-400 group-hover:text-nexus-error transition-colors">Restart Radarr</span>
    </button>

    <!-- Restart Jellyfin -->
    <button class="bg-nexus-tile border border-nexus-tile-border rounded-tile p-3 flex flex-col items-center gap-2 hover:border-nexus-error/40 hover:bg-nexus-error/5 transition-all group"
            hx-post="/api/actions/restart/jellyfin"
            hx-swap="innerHTML"
            hx-target="#action-feedback"
            hx-confirm="Restart Jellyfin container?">
        <i data-lucide="rotate-ccw" class="w-4 h-4 text-nexus-error group-hover:scale-110 transition-transform"></i>
        <span class="text-[10px] text-gray-400 group-hover:text-nexus-error transition-colors">Restart Jellyfin</span>
    </button>
</div>

<!-- Feedback area -->
<div id="action-feedback" class="mt-3 text-center text-[10px] font-mono min-h-[20px]"></div>
