<!-- Services Header -->
<div class="flex items-center justify-between mb-4">
    <div class="flex items-center gap-3">
        <h2 class="text-sm font-semibold text-white">Services</h2>
        <span class="px-2.5 py-0.5 rounded-full text-xs font-medium font-mono"
              style="background: rgba(0,212,170,0.1); color: #00D4AA;">
            {{ online_count }} online
        </span>
    </div>
    <span class="text-xs text-nexus-muted font-mono">{{ total_count }} total</span>
</div>

<!-- 4-column grid -->
<div class="grid grid-cols-4 gap-3">
    {% for svc in services %}
    <div class="service-tile relative bg-nexus-tile border border-nexus-tile-border rounded-tile p-3 flex flex-col items-center gap-2 group">
        <!-- Icon -->
        <div class="relative">
            <i data-lucide="{{ svc.lucide_icon }}"
               class="w-5 h-5 {% if svc.status == 'down' %}text-nexus-error{% else %}text-nexus-accent{% endif %}"></i>
        </div>
        <!-- Name -->
        <span class="text-xs font-medium text-gray-300 text-center leading-tight">{{ svc.name }}</span>
        <!-- Response time + status dot -->
        <div class="flex items-center gap-1.5">
            <span class="w-1.5 h-1.5 rounded-full dot-{{ svc.status }}"></span>
            <span class="font-mono text-[10px] text-nexus-muted">
                {% if svc.status == "up" %}
                    {{ svc.response_ms }}ms
                {% elif svc.status == "down" %}
                    offline
                {% elif svc.status == "degraded" %}
                    degraded
                {% else %}
                    ...
                {% endif %}
            </span>
        </div>

        <!-- Hover overlay -->
        <div class="absolute inset-0 bg-[#0A0A0F]/90 rounded-tile flex flex-col items-center justify-center gap-2
                    opacity-0 group-hover:opacity-100 transition-opacity duration-150">
            <a href="{{ svc.url }}" target="_blank" rel="noopener"
               class="flex items-center gap-1.5 px-3 py-1.5 rounded-md bg-nexus-accent/15 hover:bg-nexus-accent/25 text-nexus-accent transition-colors">
                <i data-lucide="external-link" class="w-3 h-3"></i>
                <span class="text-[11px] font-medium">Open</span>
            </a>
            <button onclick="openLogs('{{ svc.container }}', '{{ svc.name }}')"
                    class="flex items-center gap-1.5 px-3 py-1.5 rounded-md bg-nexus-secondary/15 hover:bg-nexus-secondary/25 text-nexus-secondary transition-colors">
                <i data-lucide="scroll-text" class="w-3 h-3"></i>
                <span class="text-[11px] font-medium">Logs</span>
            </button>
        </div>
    </div>
    {% endfor %}
</div>
